[project]
name = "ma-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "liane.strauch@uni-konstanz.de" }
]
requires-python = ">=3.12"
dependencies = [
    "hdbscan>=0.8.44",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "langdetect>=1.0.9",
    "matplotlib>=3.10.9",
    "nltk>=3.9.4",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.9.0",
    "requests>=2.33.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.59.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "umap-learn>=0.5.12",
]

[project.scripts]
ma-project = "ma_project:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
